<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    
    <style>
        :root {
            --background-colour-light: #ececec;
            --background-colour-dark: #121212;
            --text-colour-light: #333;
            --text-colour-dark: #fff;
            --header-height: 60px;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--background-colour-light);
            color: var(--text-colour-light);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - var(--header-height));
            margin-top: var(--header-height);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ── Header ── */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .header h1 {
            font-size: 1.8em;
            margin: 0;
            color: inherit;
            cursor: pointer;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header .subtitle {
            font-size: 1em;
            margin: 0;
            color: inherit;
            text-align: right;
        }

        /* ── Difficulty badge (header) ── */
        .difficulty-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border: 2px solid transparent;
        }

        .difficulty-badge.easy {
            background: #d4edda;
            color: #1a6630;
            border-color: #28a745;
        }

        .difficulty-badge.medium {
            background: #ffe8cc;
            color: #7d3c00;
            border-color: #fd7e14;
        }

        .difficulty-badge.hard {
            background: #f8d7da;
            color: #7b1c24;
            border-color: #dc3545;
        }

        body.dark-mode .difficulty-badge.easy {
            background: #1a3d22;
            color: #6fcf8a;
            border-color: #28a745;
        }

        body.dark-mode .difficulty-badge.medium {
            background: #3d2600;
            color: #ffb366;
            border-color: #fd7e14;
        }

        body.dark-mode .difficulty-badge.hard {
            background: #3d0a0e;
            color: #f08090;
            border-color: #dc3545;
        }

        /* ── Quiz container ── */
        .quiz-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
            transition: background 0.3s ease;
            margin: 20px;
            box-sizing: border-box;
        }

        .hidden {
            display: none;
        }

        /* ── Category selection ── */
        .category-selection {
            font-size: 1.2em;
        }

        .category-selection select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 1em;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .field-label {
            font-size: 0.85em;
            font-weight: 600;
            text-align: left;
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            color: inherit;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ── Difficulty toggle group ── */
        .difficulty-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .difficulty-group .diff-btn {
            flex: 1;
            padding: 10px 0;
            font-size: 0.95em;
            font-weight: 600;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            background: transparent;
            transition: background 0.2s ease, color 0.2s ease,
                        border-color 0.2s ease, transform 0.1s ease;
            color: inherit;
        }

        /* Idle state — subtle outline using each colour */
        .difficulty-group .diff-btn[data-value="easy"] {
            border-color: #28a745;
            color: #28a745;
        }

        .difficulty-group .diff-btn[data-value="medium"] {
            border-color: #fd7e14;
            color: #fd7e14;
        }

        .difficulty-group .diff-btn[data-value="hard"] {
            border-color: #dc3545;
            color: #dc3545;
        }

        /* Active / selected state */
        .difficulty-group .diff-btn[data-value="easy"].active {
            background: #28a745;
            color: #fff;
        }

        .difficulty-group .diff-btn[data-value="medium"].active {
            background: #fd7e14;
            color: #fff;
        }

        .difficulty-group .diff-btn[data-value="hard"].active {
            background: #dc3545;
            color: #fff;
        }

        .difficulty-group .diff-btn:hover:not(.active) {
            opacity: 0.75;
            transform: translateY(-1px);
        }

        .difficulty-group .diff-btn:active {
            transform: translateY(0);
        }

        /* Dark mode idle text is already coloured so no override needed,
           but soften the border slightly */
        body.dark-mode .difficulty-group .diff-btn[data-value="easy"] {
            border-color: #28a745;
            color: #6fcf8a;
        }

        body.dark-mode .difficulty-group .diff-btn[data-value="medium"] {
            border-color: #fd7e14;
            color: #ffb366;
        }

        body.dark-mode .difficulty-group .diff-btn[data-value="hard"] {
            border-color: #dc3545;
            color: #f08090;
        }

        body.dark-mode .difficulty-group .diff-btn[data-value="easy"].active {
            background: #28a745;
            color: #fff;
        }

        body.dark-mode .difficulty-group .diff-btn[data-value="medium"].active {
            background: #fd7e14;
            color: #fff;
        }

        body.dark-mode .difficulty-group .diff-btn[data-value="hard"].active {
            background: #dc3545;
            color: #fff;
        }

        /* ── Start button ── */
        .category-selection button.start-btn {
            background: #007BFF;
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        .category-selection button.start-btn:hover {
            background: #0056b3;
        }

        /* ── Quiz section ── */
        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress {
            font-size: 1em;
            margin-bottom: 10px;
            text-align: right;
            color: inherit;
        }

        .timer {
            --percentage: 100;
            background: conic-gradient(#007BFF calc(var(--percentage) * 1%), #ccc 0);
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .question {
            font-size: 1.2em;
            margin-bottom: 20px;
            margin-top: 2%;
        }

        .options button {
            display: block;
            background: #007BFF;
            color: #fff;
            border: none;
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            width: 100%;
        }

        .options button:hover:not(:disabled) {
            background: #0056b3;
        }

        .options button.correct {
            background: #28a745;
        }

        .options button.incorrect {
            background: #dc3545;
        }

        .result {
            font-size: 1.5em;
            margin-top: 20px;
        }

        .play-again {
            background: #007BFF;
            color: #fff;
            padding: 10px 15px;
            font-size: 1em;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        .play-again:hover {
            background: #0056b3;
        }

        /* ── Dark mode ── */
        .dark-mode-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #007BFF;
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
        }

        .dark-mode-toggle:hover {
            background: #0056b3;
        }

        body.dark-mode {
            background-color: var(--background-colour-dark);
            color: var(--text-colour-dark);
        }

        body.dark-mode .quiz-container {
            background: #333;
        }

        body.dark-mode .category-selection select {
            background: #444;
            color: #fff;
            border: 1px solid #666;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .header h1        { font-size: 1.4em; }
            .header .subtitle { font-size: 0.85em; }
            .quiz-container   { margin: 12px; padding: 16px; }

            .difficulty-group .diff-btn {
                font-size: 0.82em;
                padding: 9px 0;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 onclick="location.reload();">Quiz</h1>
        <div class="header-right">
            <div class="subtitle" id="subtitle"></div>
            <div id="header-badge"></div>
        </div>
    </div>

    <div class="quiz-container">

        <!-- Category & Difficulty Selection -->
        <div id="category-selection" class="category-selection">
            <h3>Select a Category</h3>

            <label class="field-label" for="category-dropdown">Category</label>
            <select id="category-dropdown"></select>

            <label class="field-label">Difficulty</label>
            <div class="difficulty-group" id="difficulty-group">
                <button class="diff-btn" data-value="easy"   onclick="selectDifficulty(this)">🟢 Easy</button>
                <button class="diff-btn active" data-value="medium" onclick="selectDifficulty(this)">🟠 Medium</button>
                <button class="diff-btn" data-value="hard"   onclick="selectDifficulty(this)">🔴 Hard</button>
            </div>

            <button class="start-btn" onclick="startQuiz()">Start Quiz</button>
        </div>

        <!-- Quiz Section -->
        <div id="quiz" class="hidden">
            <div class="progress-container">
                <div id="timer" class="timer"></div>
                <div id="progress" class="progress"></div>
            </div>
            <div id="question" class="question"></div>
            <div id="options" class="options"></div>
        </div>

        <!-- Result Section -->
        <div id="result" class="result hidden"></div>
        <button id="play-again" class="play-again hidden" onclick="restartQuiz()">Play Again</button>
    </div>

    <button class="dark-mode-toggle" id="dark-mode-button" onclick="toggleDarkMode()">Dark Mode</button>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        const MAX_QUESTIONS   = 20;
        const PASS_SCORE      = 85;
        const TIMER_DURATION  = 20;

        let questions            = [];
        let currentQuestionIndex = 0;
        let score                = 0;
        let selectedCategory     = '';
        let selectedCategoryName = '';
        let selectedDifficulty   = 'medium';   // default matches the pre-active button
        let timerInterval;
        let timeLeft;

        // ── Difficulty toggle ────────────────────────────────────────────────
        function selectDifficulty(btn) {
            document.querySelectorAll('.difficulty-group .diff-btn')
                    .forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedDifficulty = btn.dataset.value;
        }

        // ── Fetch & populate categories ──────────────────────────────────────
        async function fetchCategories() {
            const response = await fetch('https://opentdb.com/api_category.php');
            const data     = await response.json();
            populateCategoryDropdown(data.trivia_categories);
        }

        function populateCategoryDropdown(categories) {
            const dropdown = document.getElementById('category-dropdown');
            categories.forEach(category => {
                const option       = document.createElement('option');
                option.value       = category.id;
                option.textContent = category.name;
                dropdown.appendChild(option);
            });
        }

        // ── Fetch questions ──────────────────────────────────────────────────
        async function fetchQuestions() {
    const url = `https://opentdb.com/api.php?amount=${MAX_QUESTIONS}`
              + `&category=${selectedCategory}`
              + `&difficulty=${selectedDifficulty}`
              + `&type=multiple`;

    const response = await fetch(url);
    const data     = await response.json();

    // No questions available for this category/difficulty combination
    if (!data.results || data.results.length === 0) {
        document.getElementById('quiz').classList.add('hidden');

        const resultContainer = document.getElementById('result');
        const diffLabel = selectedDifficulty.charAt(0).toUpperCase() + selectedDifficulty.slice(1);
        resultContainer.textContent = `😕 Sorry, there are no ${diffLabel} questions available for "${selectedCategoryName}". Please go back and try a different difficulty.`;
        resultContainer.classList.remove('hidden');

        document.getElementById('play-again').classList.remove('hidden');
        return;
    }

    questions = data.results.map(q => ({
        question: decodeHTMLEntities(q.question),
        answer:   decodeHTMLEntities(q.correct_answer),
        options:  [...q.incorrect_answers, q.correct_answer]
                      .sort(() => Math.random() - 0.5)
                      .map(decodeHTMLEntities),
    }));

    loadQuestion();
}


        // ── Start quiz ───────────────────────────────────────────────────────
        function startQuiz() {
            const catDropdown = document.getElementById('category-dropdown');

            selectedCategory     = catDropdown.value;
            selectedCategoryName = catDropdown.options[catDropdown.selectedIndex].textContent;
            // selectedDifficulty is already kept in sync by selectDifficulty()

            document.getElementById('subtitle').textContent = selectedCategoryName;

            const dotMap = { easy: '🟢', medium: '🟠', hard: '🔴' };
            document.getElementById('header-badge').innerHTML =
                `<span class="difficulty-badge ${selectedDifficulty}">
                    ${dotMap[selectedDifficulty]} ${selectedDifficulty}
                 </span>`;

            document.getElementById('category-selection').classList.add('hidden');
            document.getElementById('quiz').classList.remove('hidden');
            fetchQuestions();
        }

        // ── Load question ────────────────────────────────────────────────────
        function loadQuestion() {
            if (currentQuestionIndex >= MAX_QUESTIONS || currentQuestionIndex >= questions.length) {
                showResult();
                return;
            }

            const currentQuestion = questions[currentQuestionIndex];
            document.getElementById('question').textContent = currentQuestion.question;
            updateProgress();

            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            currentQuestion.options.forEach(option => {
                const button       = document.createElement('button');
                button.textContent = option;
                button.onclick     = () => checkAnswer(button, option);
                optionsContainer.appendChild(button);
            });

            startTimer();
        }

        // ── Timer ────────────────────────────────────────────────────────────
        function startTimer() {
            const timer = document.getElementById('timer');
            timeLeft    = TIMER_DURATION;
            timer.style.setProperty('--percentage', '100');

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timer.style.setProperty('--percentage', (timeLeft / TIMER_DURATION) * 100);
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    markAsIncorrect();
                }
            }, 1000);
        }

        function updateProgress() {
            document.getElementById('progress').textContent =
                `Question ${currentQuestionIndex + 1}/${MAX_QUESTIONS}`;
        }

        function decodeHTMLEntities(text) {
            const doc = new DOMParser().parseFromString(text, 'text/html');
            return doc.documentElement.textContent;
        }

        // ── Answer checking ──────────────────────────────────────────────────
        function highlightAnswers(selectedButton, correctAnswer) {
            const buttons = document.querySelectorAll('.options button');
            buttons.forEach(btn => {
                if (btn.textContent === correctAnswer) btn.classList.add('correct');
                btn.disabled = true;
            });
            if (selectedButton && selectedButton.textContent !== correctAnswer) {
                selectedButton.classList.add('incorrect');
            }
        }

        function checkAnswer(button, selectedOption) {
            clearInterval(timerInterval);
            const { answer } = questions[currentQuestionIndex];
            if (selectedOption === answer) score++;
            highlightAnswers(button, answer);
            setTimeout(() => { currentQuestionIndex++; loadQuestion(); }, 2000);
        }

        function markAsIncorrect() {
            highlightAnswers(null, questions[currentQuestionIndex].answer);
            setTimeout(() => { currentQuestionIndex++; loadQuestion(); }, 2000);
        }

        // ── Result ───────────────────────────────────────────────────────────
        function showResult() {
            const resultContainer = document.getElementById('result');
            const percentage      = Math.round((score / MAX_QUESTIONS) * 100);

            document.getElementById('quiz').classList.add('hidden');
            resultContainer.classList.remove('hidden');
            resultContainer.textContent = percentage >= PASS_SCORE
                ? `🎉 Congratulations! You nailed it with a score of ${percentage}%.`
                : `😅 Great effort! You scored ${percentage}%. Remember, every attempt is a chance to grow. You'll do even better next time!`;

            document.getElementById('play-again').classList.remove('hidden');
            if (percentage >= PASS_SCORE) launchConfetti();
        }

        function restartQuiz() {
            score                = 0;
            currentQuestionIndex = 0;
            document.getElementById('result').classList.add('hidden');
            document.getElementById('quiz').classList.add('hidden');
            document.getElementById('play-again').classList.add('hidden');
            document.getElementById('category-selection').classList.remove('hidden');
            document.getElementById('subtitle').textContent   = '';
            document.getElementById('header-badge').innerHTML = '';
        }

        function launchConfetti() {
            confetti({ particleCount: 100, spread: 90, origin: { x: 0.5, y: 0.5 } });
        }

        // ── Dark mode ────────────────────────────────────────────────────────
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('dark-mode-button').textContent = isDark ? 'Light Mode' : 'Dark Mode';
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
        }

        function applySavedMode() {
            if (localStorage.getItem('darkMode') === 'enabled') {
                document.body.classList.add('dark-mode');
                document.getElementById('dark-mode-button').textContent = 'Light Mode';
            }
        }

        // ── Init ─────────────────────────────────────────────────────────────
        window.onload = () => {
            applySavedMode();
            fetchCategories();
        };
    </script>
</body>
</html>
